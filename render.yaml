services:
  - type: web
    name: airo2-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port     envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PROVIDER_MODE
        value: historical
